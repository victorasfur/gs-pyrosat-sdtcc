name: PyroSat — Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes básicos
        run: |
          python -c "from app import app; print('App importado com sucesso')"
          python -c "import flask; print('Flask OK:', flask.__version__)"

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          package: .
          startup-command: gunicorn --bind=0.0.0.0:8000 app:app

      - name: Verificar deploy
        run: |
          echo "✅ Deploy concluído com sucesso!"
          echo "🌐 URL: https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net"
          echo "🛰️ PyroSat está no ar!"
